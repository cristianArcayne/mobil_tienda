<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Probador Virtual con Cámara en Vivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0f172a; font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        /* Modal Probador Virtual (Estilo Móvil) */
        .probador-modal {
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: 940px;
            background: #0a0f1d;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 1. Header Superior Blanco */
        .modal-header {
            background: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            z-index: 30;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scanner-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #eff6ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 12.5px;
            color: #64748b;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
            font-weight: 500;
        }

        .btn-close-header {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: all 0.2s;
        }

        .btn-close-header:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* 2. Cuerpo Central Oscuro (Cámara y AR) */
        .modal-body {
            flex: 1;
            position: relative;
            background: #0a0f1d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Video de la cámara en vivo */
        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            transform: scaleX(-1); /* Efecto espejo para selfie */
            z-index: 1;
        }

        #camera-video.back-camera {
            transform: scaleX(1);
        }

        /* Superposición AR de la Prenda */
        .ar-overlay-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 5;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ar-garment-img {
            max-width: 68%;
            max-height: 56%;
            object-fit: contain;
            margin-top: 14%;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            animation: breathing 4s ease-in-out infinite;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes breathing {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }

        /* Badge Prenda de Referencia */
        .prenda-ref-pill {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            padding: 5px 14px 5px 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .prenda-ref-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #ffffff;
            background: #ffffff;
        }

        /* Botón Cambiar Cámara (Selfie / Trasera) */
        .btn-toggle-cam {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .btn-toggle-cam:hover {
            background: rgba(79, 70, 229, 0.85);
            transform: scale(1.08);
        }

        /* Ventana PIP (Picture in Picture) en esquina inferior derecha */
        .pip-preview-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 90px;
            height: 120px;
            border-radius: 14px;
            background: #000000;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 20;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pip-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pip-badge {
            position: absolute;
            bottom: 4px;
            background: rgba(0,0,0,0.7);
            color: #38bdf8;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        /* Línea de escaneo láser biométrica */
        .scanning-laser-line {
            position: absolute;
            left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #4f46e5, #06b6d4, #10b981, transparent);
            box-shadow: 0 0 12px #38bdf8;
            z-index: 6;
            animation: scanMove 3s ease-in-out infinite;
        }

        @keyframes scanMove {
            0% { top: 15%; opacity: 0; }
            30% { opacity: 0.8; }
            70% { opacity: 0.8; }
            100% { top: 85%; opacity: 0; }
        }

        /* Overlay de sesión finalizada tras 15s */
        .session-finished-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 29, 0.9);
            backdrop-filter: blur(8px);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .finished-icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            color: white;
        }

        .finished-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 6px 0;
        }

        .finished-desc {
            color: #94a3b8;
            font-size: 13.5px;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .finished-actions {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-restart-test {
            flex: 1;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart-test:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        /* 3. Footer Blanco */
        .modal-footer {
            background: #ffffff;
            padding: 16px 20px 20px;
            border-top: 1px solid #e2e8f0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Texto y Barra de Temporizador (15 segundos) */
        .timer-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
            color: #475569;
            font-weight: 600;
        }

        .timer-badge-count {
            background: #f1f5f9;
            color: #4f46e5;
            font-family: monospace;
            font-weight: 800;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .timer-progress-track {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .timer-progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
            transition: width 1s linear;
        }

        /* Botón Cerrar (Negro / Azul marino de ancho completo) */
        .btn-close-main {
            width: 100%;
            height: 48px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
        }

        .btn-close-main:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .btn-close-main:active {
            transform: translateY(0);
        }

        /* Mensaje de Carga / Inicialización */
        .loading-camera-box {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-align: center;
            gap: 12px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="probador-modal">
        
        <!-- HEADER SUPERIOR -->
        <div class="modal-header">
            <div class="header-left">
                <div class="scanner-icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        <circle cx="9" cy="9" r="1.5" fill="currentColor"></circle>
                        <circle cx="15" cy="9" r="1.5" fill="currentColor"></circle>
                        <path d="M9 14c1.5 1.5 4.5 1.5 6 0"></path>
                    </svg>
                </div>
                <div class="header-titles">
                    <h2 class="header-title">Probador Virtual</h2>
                    <span id="prenda-subtitle" class="header-subtitle">Cargando prenda...</span>
                </div>
            </div>

            <button class="btn-close-header" title="Cerrar Probador" onclick="cerrarProbador()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- CUERPO CENTRAL OSCURO CON CÁMARA EN VIVO -->
        <div class="modal-body">
            
            <!-- Video en vivo de la cámara -->
            <video id="camera-video" autoplay playsinline muted></video>

            <!-- Línea biométrica de escaneo láser -->
            <div class="scanning-laser-line"></div>

            <!-- Prenda de referencia flotante arriba a la izquierda -->
            <div class="prenda-ref-pill">
                <img id="ref-thumbnail" src="" alt="Prenda" class="prenda-ref-thumb" />
                <span>Prenda de referencia</span>
            </div>

            <!-- Botón Cambiar Cámara (Girar) -->
            <button class="btn-toggle-cam" title="Girar Cámara" onclick="cambiarCamara()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 1.956.702 3.748 1.87 5.143L4 17h5v-5l-1.802 1.802A5.965 5.965 0 0 1 6 10c0-3.314 2.686-6 6-6s6 2.686 6 6c0 1.657-.672 3.157-1.758 4.243l1.414 1.414A7.962 7.962 0 0 0 20 10z"/>
                </svg>
            </button>

            <!-- Capa AR con la Prenda Superpuesta sobre el usuario -->
            <div class="ar-overlay-layer">
                <img id="ar-garment-target" src="" alt="Prenda AR" class="ar-garment-img" />
            </div>

            <!-- Mini PIP (Picture in Picture) abajo a la derecha -->
            <div class="pip-preview-box">
                <img id="pip-thumbnail" src="" alt="PIP Prenda" class="pip-thumb-img" />
                <span class="pip-badge">PIP 3D</span>
            </div>

            <!-- Estado de Carga de Cámara -->
            <div id="camera-loading" class="loading-camera-box">
                <div class="spinner"></div>
                <p style="margin: 0; font-size: 13.5px; font-weight: 600;">Iniciando cámara en vivo...</p>
            </div>

            <!-- Overlay cuando expiran los 15 segundos -->
            <div id="finished-overlay" class="session-finished-overlay" style="display: none;">
                <div class="finished-icon-circle">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h3 class="finished-title">¡Prueba de 15s Completada!</h3>
                <p class="finished-desc">Has probado virtualmente la prenda sobre tu cámara con ajuste fotométrico en tiempo real.</p>
                <div class="finished-actions">
                    <button class="btn-restart-test" onclick="iniciarTemporizador15s()">Probar de nuevo (15s)</button>
                </div>
            </div>

        </div>

        <!-- FOOTER INFERIOR -->
        <div class="modal-footer">
            
            <!-- Barra de temporizador 15 segundos -->
            <div class="timer-info-row">
                <span>La prueba dura 15s y se corta sola.</span>
                <span id="countdown-badge" class="timer-badge-count">15s</span>
            </div>

            <div class="timer-progress-track">
                <div id="timer-progress-bar" class="timer-progress-fill"></div>
            </div>

            <!-- Botón Cerrar -->
            <button class="btn-close-main" onclick="cerrarProbador()">
                Cerrar
            </button>

        </div>

    </div>

    <script>
        let currentStream = null;
        let currentFacingMode = "user";
        let tiempoRestante = 15;
        let timerInterval = null;
        let garmentUrl = "";
        let garmentName = "";

        // Obtener parámetros de la URL enviados desde Flutter
        function cargarParametros() {
            const params = new URLSearchParams(window.location.search);
            garmentUrl = params.get('garment') || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500';
            garmentName = params.get('name') || 'Camiseta básica de algodón celeste';

            // Actualizar textos e imágenes
            document.getElementById('prenda-subtitle').innerText = garmentName;
            document.getElementById('ref-thumbnail').src = garmentUrl;
            document.getElementById('pip-thumbnail').src = garmentUrl;
            document.getElementById('ar-garment-target').src = garmentUrl;
        }

        // Encender la cámara real del dispositivo (Webcam o Smartphone)
        async function iniciarCamara() {
            const loadingBox = document.getElementById('camera-loading');
            loadingBox.style.display = 'flex';

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const video = document.getElementById('camera-video');

            try {
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                video.onloadedmetadata = () => {
                    video.play();
                    loadingBox.style.display = 'none';
                    iniciarTemporizador15s();
                };
            } catch (err) {
                console.warn("No se pudo acceder a la cámara:", err);
                loadingBox.innerHTML = `
                    <p style="color: #f87171; font-weight: 700; margin-bottom: 4px;">⚠️ Permiso de cámara no concedido</p>
                    <p style="font-size: 12px; color: #94a3b8; max-width: 240px;">Habilite el acceso a la cámara en el navegador para la prueba en vivo.</p>
                `;
                // Iniciar de todos modos el temporizador de 15 segundos para la simulación
                iniciarTemporizador15s();
            }
        }

        // Alternar entre cámara frontal y trasera
        function cambiarCamara() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            const video = document.getElementById('camera-video');
            if (currentFacingMode === "user") {
                video.classList.remove('back-camera');
            } else {
                video.classList.add('back-camera');
            }
            iniciarCamara();
        }

        // Temporizador estricto de 15 segundos (La prueba dura 15s y se corta sola)
        function iniciarTemporizador15s() {
            clearInterval(timerInterval);
            tiempoRestante = 15;
            document.getElementById('finished-overlay').style.display = 'none';

            const badge = document.getElementById('countdown-badge');
            const progress = document.getElementById('timer-progress-bar');
            
            badge.innerText = '15s';
            progress.style.transition = 'width 1s linear';
            progress.style.width = '100%';

            timerInterval = setInterval(() => {
                tiempoRestante--;
                badge.innerText = `${tiempoRestante}s`;
                const porcentaje = (tiempoRestante / 15) * 100;
                progress.style.width = `${porcentaje}%`;

                if (tiempoRestante <= 0) {
                    clearInterval(timerInterval);
                    finalizarPrueba15s();
                }
            }, 1000);
        }

        // Acción al agotarse los 15 segundos
        function finalizarPrueba15s() {
            document.getElementById('finished-overlay').style.display = 'flex';
            const badge = document.getElementById('countdown-badge');
            badge.innerText = '0s';
            document.getElementById('timer-progress-bar').style.width = '0%';
        }

        // Cerrar y retornar a la vista de Flutter
        function cerrarProbador() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('goBack');
            } else if (window.parent) {
                window.parent.postMessage('goBack', '*');
            } else {
                window.history.back();
            }
        }

        window.addEventListener('beforeunload', () => {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
        });

        window.onload = () => {
            cargarParametros();
            iniciarCamara();
        };
    </script>
</body>
</html>
