<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Probador Virtual con Lucy AR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0b1120; font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        /* Modal Probador Virtual (Diseño idéntico a la app móvil) */
        .probador-modal {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 920px;
            background: #0a0f1d;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 1. Header Superior Blanco */
        .modal-header {
            background: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            z-index: 30;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scanner-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #f1f5f9;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
            font-weight: 500;
        }

        .btn-close-header {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: all 0.2s;
        }

        .btn-close-header:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* 2. Cuerpo Central Oscuro (Cámara en Vivo + Lucy VTON AR) */
        .modal-body {
            flex: 1;
            position: relative;
            background: #070b14;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* VIDEO PRINCIPAL DE FONDO (Lucy VTON Try-On / Cámara en vivo) */
        #output {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Espejo natural selfie */
            z-index: 1;
            background: #070b14;
        }

        #output.back-camera {
            transform: scaleX(1);
        }

        /* CAPA AR DE SUPERPOSICIÓN DE LA PRENDA SOBRE EL CUERPO */
        .ar-overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ar-garment-img {
            max-width: 70%;
            max-height: 60%;
            object-fit: contain;
            margin-top: 14%;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.75));
            animation: softBreathing 4s ease-in-out infinite;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes softBreathing {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }

        /* Línea biométrica de escaneo */
        .scanning-laser-line {
            position: absolute;
            left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #4f46e5, #38bdf8, #10b981, transparent);
            box-shadow: 0 0 14px #38bdf8;
            z-index: 7;
            pointer-events: none;
            animation: laserScan 3.5s ease-in-out infinite;
        }

        @keyframes laserScan {
            0% { top: 12%; opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { top: 88%; opacity: 0; }
        }

        /* Badge Superior: Prenda de referencia */
        .prenda-ref-pill {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 5px 14px 5px 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .prenda-ref-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #ffffff;
            background: #ffffff;
        }

        /* Badge Estado IA */
        .ai-status-pill {
            position: absolute;
            top: 16px;
            right: 64px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
        }

        .ai-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
        }

        /* Botón Cambiar Cámara (Girar) */
        .btn-toggle-cam {
            position: absolute;
            top: 14px;
            right: 16px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .btn-toggle-cam:hover {
            background: rgba(79, 70, 229, 0.85);
            transform: scale(1.08);
        }

        /* 3. "ESA PEQUEÑITA DE LA CÁMARA" (Ventana PIP en esquina inferior derecha) */
        .camera-pip-window {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 115px;
            height: 155px;
            border-radius: 14px;
            background: #000000;
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
            z-index: 25;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .camera-pip-window:hover {
            transform: scale(1.04);
            border-color: #38bdf8;
        }

        /* Video de la cámara local / selfie en la ventanita PIP */
        #input {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Espejo natural selfie */
            background: #000;
        }

        #input.back-camera {
            transform: scaleX(1);
        }

        /* Barra de estado en la ventanita PIP */
        .pip-header-bar {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
            pointer-events: none;
        }

        .pip-live-badge {
            background: rgba(239, 68, 68, 0.9);
            color: #ffffff;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .pip-live-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffffff;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .pip-caption {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            font-size: 8.5px;
            font-weight: 700;
            padding: 2px;
            border-radius: 4px;
            letter-spacing: 0.3px;
        }

        /* Mensaje de Inicialización / Carga */
        .loading-camera-box {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-align: center;
            gap: 10px;
            background: rgba(10, 15, 29, 0.85);
            padding: 16px 24px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 4. Footer Blanco con Botón Cerrar */
        .modal-footer {
            background: #ffffff;
            padding: 16px 20px 20px;
            border-top: 1px solid #e2e8f0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-close-main {
            width: 100%;
            height: 48px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
        }

        .btn-close-main:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .btn-close-main:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="probador-modal">
        
        <!-- HEADER SUPERIOR BLANCO -->
        <div class="modal-header">
            <div class="header-left">
                <div class="scanner-icon-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                        <circle cx="9" cy="9" r="1.5" fill="currentColor"></circle>
                        <circle cx="15" cy="9" r="1.5" fill="currentColor"></circle>
                        <path d="M9 14c1.5 1.5 4.5 1.5 6 0"></path>
                    </svg>
                </div>
                <div class="header-titles">
                    <h2 class="header-title">Probador Virtual</h2>
                    <span id="prenda-subtitle" class="header-subtitle">Cargando prenda...</span>
                </div>
            </div>

            <button class="btn-close-header" title="Cerrar Probador" onclick="cerrarProbador()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- CUERPO CENTRAL OSCURO: CÁMARA + LUCY VTON AR -->
        <div class="modal-body">
            
            <!-- VIDEO PRINCIPAL DE FONDO (Lucy VTON Try-On / Cámara en vivo) -->
            <video id="output" autoplay playsinline></video>

            <!-- Capa AR: La prenda adaptada sobre el cuerpo -->
            <div id="ar-overlay" class="ar-overlay-layer">
                <img id="ar-garment-target" src="" alt="Prenda AR" class="ar-garment-img" />
            </div>

            <!-- Línea biométrica láser -->
            <div class="scanning-laser-line"></div>

            <!-- Prenda de referencia flotante arriba a la izquierda -->
            <div class="prenda-ref-pill">
                <img id="ref-thumbnail" src="" alt="Prenda" class="prenda-ref-thumb" />
                <span>Prenda de referencia</span>
            </div>

            <!-- Badge estado Lucy AI -->
            <div class="ai-status-pill">
                <span class="ai-status-dot"></span>
                <span id="status-text">Lucy AR en Vivo</span>
            </div>

            <!-- Botón Cambiar Cámara (Girar) -->
            <button class="btn-toggle-cam" title="Girar Cámara" onclick="cambiarCamara()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 1.956.702 3.748 1.87 5.143L4 17h5v-5l-1.802 1.802A5.965 5.965 0 0 1 6 10c0-3.314 2.686-6 6-6s6 2.686 6 6c0 1.657-.672 3.157-1.758 4.243l1.414 1.414A7.962 7.962 0 0 0 20 10z"/>
                </svg>
            </button>

            <!-- VENTANA PEQUEÑA DE LA CÁMARA (PIP Abajo a la Derecha) -->
            <div class="camera-pip-window" title="Toca para intercambiar vista" onclick="intercambiarVistas()">
                <video id="input" autoplay playsinline muted></video>

                <div class="pip-header-bar">
                    <div class="pip-live-badge">
                        <span class="pip-live-dot"></span>
                        <span id="pip-label">CAM</span>
                    </div>
                </div>

                <div class="pip-caption">Tu Cámara</div>
            </div>

            <!-- Estado de Carga Inicial -->
            <div id="camera-loading" class="loading-camera-box">
                <div class="spinner"></div>
                <p id="loading-msg" style="margin: 0; font-size: 13.5px; font-weight: 600;">Iniciando cámara y Lucy AR...</p>
            </div>

        </div>

        <!-- FOOTER INFERIOR BLANCO (Sin temporizador de 15s) -->
        <div class="modal-footer">
            <button class="btn-close-main" onclick="cerrarProbador()">
                Cerrar
            </button>
        </div>

    </div>

    <!-- Módulo JS para Lucy VTON Realtime + WebRTC Fallback -->
    <script type="module">
        import { createDecartClient, models } from 'https://esm.sh/@decartai/sdk';

        let session = null;
        let localStream = null;
        let currentFacingMode = "user";
        let baseGarmentUrl = "";
        let garmentName = "";
        let globalGarmentBase64 = "";
        let isSwapped = false;

        const decartApiKeys = [
            "dct_tienda-virtual_MFvQCKqLlCmcRVTfIGcoypZXfkiCWGeOrqgzFsbOKpCdEZhgJQERagVnPbbXqQzq",
            "dct_si2-parcial_qOCBWVtsCDmnrhLMjaIYMTjRJMnTqIOvtoCrcHWOepoDKFWkVSfgFowaeMznUrJw"
        ];

        function getFallbackImage(name, url) {
            const clean = ((name || '') + ' ' + (url || '')).toLowerCase();
            if (clean.includes('denim') || clean.includes('chaqueta')) {
                return 'https://tienda-backend-kvfk.onrender.com/static/uploads/chaqueta_denim_clasica.jpg';
            } else if (clean.includes('chamarra') || clean.includes('racco')) {
                return 'https://tienda-backend-kvfk.onrender.com/static/uploads/chamarra_racco_negra.png';
            } else if (clean.includes('polera') || clean.includes('cat')) {
                return 'https://tienda-backend-kvfk.onrender.com/static/uploads/polera_cat_gris.png';
            } else if (clean.includes('jean') || clean.includes('pantalon') || clean.includes('slim')) {
                return 'https://tienda-backend-kvfk.onrender.com/static/uploads/jean_slim_azul.jpg';
            } else if (clean.includes('chompa')) {
                return 'https://tienda-backend-kvfk.onrender.com/static/uploads/chompa_azul_marino.jpg';
            }
            return 'https://tienda-backend-kvfk.onrender.com/static/uploads/chaqueta_denim_clasica.jpg';
        }

        // 1. Cargar parámetros de la URL
        async function cargarParametros() {
            const params = new URLSearchParams(window.location.search);
            garmentName = params.get('name') || 'Chaqueta Denim Vintage';
            let rawUrl = params.get('garment') || '';

            // Si viene una variante rota (ej: variante_2_be8f0db3.png) o vacía, usar la imagen del catálogo verificada
            if (!rawUrl || rawUrl.includes('variante_')) {
                baseGarmentUrl = getFallbackImage(garmentName, rawUrl);
            } else {
                baseGarmentUrl = rawUrl;
            }

            document.getElementById('prenda-subtitle').innerText = garmentName;

            const refThumb = document.getElementById('ref-thumbnail');
            const arTarget = document.getElementById('ar-garment-target');

            refThumb.onerror = () => {
                refThumb.onerror = null;
                refThumb.src = getFallbackImage(garmentName, baseGarmentUrl);
            };

            arTarget.onerror = () => {
                arTarget.onerror = null;
                const fallback = getFallbackImage(garmentName, baseGarmentUrl);
                arTarget.src = fallback;
                globalGarmentBase64 = fallback;
            };

            refThumb.src = baseGarmentUrl;
            arTarget.src = baseGarmentUrl;

            // Convertir prenda a Base64 para Lucy VTON
            globalGarmentBase64 = baseGarmentUrl;
            try {
                const res = await fetch(baseGarmentUrl);
                if (res.ok) {
                    const blob = await res.blob();
                    globalGarmentBase64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                    });
                }
            } catch(e) {
                console.warn("Base64 fetch fallback:", e);
            }
        }

        // 2. Iniciar Cámara y Conexión Lucy VTON
        async function iniciarProbador() {
            await cargarParametros();
            const inputVideo = document.getElementById('input');
            const outputVideo = document.getElementById('output');
            const loadingBox = document.getElementById('camera-loading');
            const loadingMsg = document.getElementById('loading-msg');
            const statusText = document.getElementById('status-text');
            const arOverlay = document.getElementById('ar-overlay');

            try {
                // Obtener stream de la cámara del usuario
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // Conectar stream a la ventanita pequeña (PIP) de la cámara
                inputVideo.srcObject = localStream;
                await inputVideo.play();

                // Conectar temporalmente el stream de fondo para vista inmediata
                outputVideo.srcObject = localStream;
                await outputVideo.play();

                // Ocultar modal de carga inmediatamente para no bloquear la experiencia
                loadingBox.style.display = 'none';

                // Intentar conectar con el servicio Lucy VTON (Decart AI)
                let connected = false;
                for (let i = 0; i < decartApiKeys.length; i++) {
                    const key = decartApiKeys[i];
                    loadingMsg.innerText = `Conectando con Lucy VTON (${i + 1}/${decartApiKeys.length})...`;
                    try {
                        const client = createDecartClient({ apiKey: key });
                        session = await client.realtime.connect(localStream, {
                            model: models.realtime("lucy-vton-3.5"),
                            onRemoteStream: (transformedStream) => {
                                console.log("¡Stream transformado por Lucy VTON recibido!");
                                outputVideo.srcObject = transformedStream;
                                outputVideo.play();
                                // La IA ya coloca la ropa directamente en el cuerpo en el stream
                                arOverlay.style.display = 'none';
                                statusText.innerText = 'Lucy VTON Activo';
                            },
                            initialState: {
                                image: globalGarmentBase64,
                                referenceImage: globalGarmentBase64,
                                prompt: { text: "virtual try on this clothing", image: globalGarmentBase64 }
                            }
                        });
                        connected = true;
                        console.log(`[Lucy VTON] Conectado exitosamente con clave #${i + 1}`);
                        break;
                    } catch (e) {
                        console.warn(`[Lucy VTON] Clave #${i + 1} no disponible o límite alcanzado:`, e);
                    }
                }

                if (!connected) {
                    console.log("[Lucy VTON] Modo AR Óptico Directo activo sobre el cuerpo.");
                    statusText.innerText = 'Probador AR Directo';
                    arOverlay.style.display = 'flex';
                }

            } catch (err) {
                console.error("Error al iniciar cámara:", err);
                loadingBox.innerHTML = `
                    <p style="color: #f87171; font-weight: 700; margin: 0;">Error de acceso a cámara</p>
                    <p style="color: #94a3b8; font-size: 12px; margin: 4px 0 0 0;">Verifica los permisos en tu navegador</p>
                `;
            }
        }

        // 3. Alternar entre cámara frontal y trasera
        window.cambiarCamara = async function() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            const inputVideo = document.getElementById('input');
            const outputVideo = document.getElementById('output');

            if (currentFacingMode === "user") {
                inputVideo.classList.remove('back-camera');
                outputVideo.classList.remove('back-camera');
            } else {
                inputVideo.classList.add('back-camera');
                outputVideo.classList.add('back-camera');
            }

            if (session && session.disconnect) {
                session.disconnect();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            document.getElementById('camera-loading').style.display = 'flex';
            setTimeout(() => {
                iniciarProbador();
            }, 300);
        };

        // 4. Intercambiar vistas entre pantalla principal y ventanita PIP
        window.intercambiarVistas = function() {
            const inputVideo = document.getElementById('input');
            const outputVideo = document.getElementById('output');
            const pipLabel = document.getElementById('pip-label');
            const arOverlay = document.getElementById('ar-overlay');

            isSwapped = !isSwapped;
            const tempStream = inputVideo.srcObject;
            inputVideo.srcObject = outputVideo.srcObject;
            outputVideo.srcObject = tempStream;

            if (isSwapped) {
                pipLabel.innerText = 'AR';
                arOverlay.style.display = 'none';
            } else {
                pipLabel.innerText = 'CAM';
                if (!session) {
                    arOverlay.style.display = 'flex';
                }
            }
        };

        // 5. Cerrar probador
        window.cerrarProbador = function() {
            if (session && session.disconnect) {
                try { session.disconnect(); } catch(e){}
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('goBack');
            } else if (window.parent) {
                window.parent.postMessage('goBack', '*');
            } else {
                window.history.back();
            }
        };

        window.addEventListener('beforeunload', () => {
            if (session && session.disconnect) {
                try { session.disconnect(); } catch(e){}
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
        });

        window.onload = iniciarProbador;
    </script>
</body>
</html>
