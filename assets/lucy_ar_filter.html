<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucy AR Try-On</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #output { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #input { display: none; }
        
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; z-index: 10; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; }
        
        /* Botones de acción superiores modernos con efecto Glassmorphic */
        .top-action-btn {
            position: absolute;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .top-action-btn:hover {
            background: rgba(15, 23, 42, 0.85);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .top-action-btn:active {
            transform: scale(0.92);
            background: rgba(79, 70, 229, 0.85);
        }

        #back-switch {
            top: 26px;
            left: 20px;
        }

        #cam-switch {
            top: 26px;
            right: 20px;
        }

        /* Ocultar barra de tonos de colores inferior */
        .controls {
            display: none !important;
        }
    </style>
</head>
<body>
    <button id="back-switch" class="top-action-btn" title="Regresar" onclick="if(window.flutter_inappwebview){window.flutter_inappwebview.callHandler('goBack');}else{window.parent.postMessage('goBack', '*');}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>
    <button id="cam-switch" class="top-action-btn" title="Girar Cámara" onclick="toggleCamera()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 1.956.702 3.748 1.87 5.143L4 17h5v-5l-1.802 1.802A5.965 5.965 0 0 1 6 10c0-3.314 2.686-6 6-6s6 2.686 6 6c0 1.657-.672 3.157-1.758 4.243l1.414 1.414A7.962 7.962 0 0 0 20 10z"/>
        </svg>
    </button>
    <div id="loader">
        <h3>Conectando a Vestidor Virtual IA...</h3>
        <p>Iniciando...</p>
    </div>
    
    <video id="input" autoplay playsinline muted></video>
    <video id="output" autoplay playsinline></video>

    <!-- Controls for color switching generated dynamically -->
    <div class="controls" id="color-controls" style="display: none;"></div>

    <script type="module">
        import { createDecartClient, models } from 'https://esm.sh/@decartai/sdk';
        
        let session = null;
        let baseGarmentUrl = "";
        let globalGarmentBase64 = "";

        let currentFacingMode = "user";
        
        window.toggleCamera = async function() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            const inputVideo = document.getElementById('input');
            const outputVideo = document.getElementById('output');
            
            if (currentFacingMode === "user") {
                outputVideo.style.transform = "scaleX(-1)";
            } else {
                outputVideo.style.transform = "none";
            }
            
            if (session && session.disconnect) {
                session.disconnect();
            }
            
            // Stop current camera tracks before switching
            if (inputVideo.srcObject) {
                inputVideo.srcObject.getTracks().forEach(track => track.stop());
                inputVideo.srcObject = null;
            }
            
            document.getElementById('loader').style.display = 'block';
            
            // Short delay to ensure hardware releases the camera
            setTimeout(() => {
                startAR();
            }, 500);
        }

        let availableColors = [];

        const colorMap = {
            'rojo': { hex: '#EF4444', eng: 'red' },
            'azul': { hex: '#3B82F6', eng: 'blue' },
            'verde': { hex: '#22C55E', eng: 'green' },
            'amarillo': { hex: '#EAB308', eng: 'yellow' },
            'blanco': { hex: '#F8FAFC', eng: 'white' },
            'negro': { hex: '#0F172A', eng: 'black' },
            'beige': { hex: '#F5F5DC', eng: 'beige' },
            'denim': { hex: '#1E3A8A', eng: 'denim' }
        };

        function getHexForColor(colorName) {
            const clean = colorName.toLowerCase().trim();
            for (const key in colorMap) {
                if (clean.includes(key)) return colorMap[key].hex;
            }
            return '#888888';
        }

        function getEnglishForColor(colorName) {
            const clean = colorName.toLowerCase().trim();
            for (const key in colorMap) {
                if (clean.includes(key)) return colorMap[key].eng;
            }
            return colorName;
        }

        async function startAR() {
            const inputVideo = document.getElementById('input');
            const outputVideo = document.getElementById('output');
            const loader = document.getElementById('loader');
            const colorControls = document.getElementById('color-controls');

            try {
                const urlParams = new URLSearchParams(window.location.search);
                baseGarmentUrl = urlParams.get('garment');
                const colorsParam = urlParams.get('colors');
                if (colorsParam) {
                    availableColors = colorsParam.split(',').filter(c => c.trim().length > 0);
                }

                // El URL ya deberÃ­a venir formateado desde Flutter con su IP correcta
                if (baseGarmentUrl && baseGarmentUrl.startsWith('/')) {
                    // Fallback de emergencia, pero Flutter ya debe mandar url absoluta
                    console.log("Advertencia: Se recibio URL relativa: " + baseGarmentUrl);
                }

                const isLandscape = window.innerWidth > window.innerHeight;
                const videoConstraints = isLandscape 
                    ? { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
                    : { facingMode: currentFacingMode, width: { ideal: 720 }, height: { ideal: 1280 } };

                const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
                inputVideo.srcObject = stream;
                await inputVideo.play();

                // Pool de claves Decart AI con conmutación automática por agotamiento de tokens
                const decartApiKeys = [
                    "dct_tienda-virtual_MFvQCKqLlCmcRVTfIGcoypZXfkiCWGeOrqgzFsbOKpCdEZhgJQERagVnPbbXqQzq",
                    "dct_si2-parcial_qOCBWVtsCDmnrhLMjaIYMTjRJMnTqIOvtoCrcHWOepoDKFWkVSfgFowaeMznUrJw"
                ];

                const garmentUrl = baseGarmentUrl || 'https://via.placeholder.com/300';
                globalGarmentBase64 = garmentUrl;
                
                // Convert local image to Base64 so the Cloud AI can read it
                if (garmentUrl.includes('192.168') || garmentUrl.startsWith('http://10.0.2.2') || garmentUrl.startsWith('http://127.0.0.1')) {
                    try {
                        const res = await fetch(garmentUrl);
                        const blob = await res.blob();
                        globalGarmentBase64 = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onloadend = () => resolve(reader.result);
                            reader.readAsDataURL(blob);
                        });
                        console.log("Image converted to Base64!");
                    } catch(err) {
                        console.error("Failed to convert to base64", err);
                    }
                }
                
                let sessionConnected = false;
                let lastError = null;

                for (let k = 0; k < decartApiKeys.length; k++) {
                    const currentKey = decartApiKeys[k];
                    const keyPreview = currentKey.substring(0, 19) + "...";
                    console.log(`[Decart AI] Intentando conectar con clave #${k + 1}/${decartApiKeys.length} (${keyPreview})...`);
                    loader.innerHTML = `<h3>Conectando a Vestidor Virtual IA...</h3><p>Validando tokens de servicio (${k + 1}/${decartApiKeys.length})...</p>`;

                    try {
                        const client = createDecartClient({ apiKey: currentKey });
                        session = await client.realtime.connect(stream, {
                            model: models.realtime("lucy-vton-3.5"),
                            onRemoteStream: (transformedStream) => {
                                outputVideo.srcObject = transformedStream;
                                outputVideo.play();
                            },
                            initialState: { 
                                image: globalGarmentBase64,
                                referenceImage: globalGarmentBase64,
                                prompt: { text: "virtual try on this clothing", image: globalGarmentBase64 }
                            }
                        });

                        console.log(`[Decart AI] ¡Conexión establecida con éxito con la clave #${k + 1}!`);
                        sessionConnected = true;
                        break;
                    } catch (e) {
                        console.warn(`[Decart AI] Clave #${k + 1} falló o agotó sus tokens:`, e);
                        lastError = e;
                        // Continúa al siguiente ciclo para probar la siguiente clave API
                    }
                }

                if (!sessionConnected) {
                    throw new Error("No se pudo conectar a Decart AI. Todas las claves agotaron sus tokens o fallaron: " + (lastError ? lastError.message : "Error desconocido"));
                }
                
                loader.style.display = 'none';

                if (availableColors.length > 0) {
                    colorControls.style.display = 'none';
                }

                window.addEventListener('beforeunload', () => {
                    if (session && session.disconnect) session.disconnect();
                    stream.getTracks().forEach(track => track.stop());
                });

            } catch (err) {
                console.error("Error IA:", err);
                loader.innerHTML = '<h3>Error en IA</h3><p>' + err.message + '</p>';
            }
        }

        window.changeColor = async function(colorName) {
            if(!session) return;
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            loader.innerHTML = '<p>Cargando foto real de ' + colorName + '...</p>';
            try {
                const engColor = getEnglishForColor(colorName);
                let imageToUse = globalGarmentBase64;
                
                if (baseGarmentUrl) {
                    try {
                        let newUrl = baseGarmentUrl;
                        let suffix = "";
                        const cleanColor = colorName.toLowerCase();
                        if (cleanColor.includes('negro') || cleanColor.includes('black')) {
                            suffix = '_negro';
                        } else if (cleanColor.includes('azul') || cleanColor.includes('blue')) {
                            suffix = '_azul';
                        } else if (cleanColor.includes('rojo') || cleanColor.includes('red')) {
                            suffix = '_rojo';
                        } else {
                            suffix = '_' + cleanColor.split(' ')[0];
                        }

                        if (newUrl.endsWith('.jpg')) {
                            newUrl = newUrl.replace('.jpg', suffix + '.jpg');
                        } else if (newUrl.endsWith('.png')) {
                            newUrl = newUrl.replace('.png', suffix + '.png');
                        }
                        
                        console.log("Fetching new image:", newUrl);
                        const res = await fetch(newUrl);
                        if (res.ok) {
                            const blob = await res.blob();
                            imageToUse = await new Promise((resolve) => {
                                const reader = new FileReader();
                                reader.onloadend = () => resolve(reader.result);
                                reader.readAsDataURL(blob);
                            });
                            console.log("¡Imagen descargada exitosamente!");
                        } else {
                            console.log("Fallback a la imagen original, status:", res.status);
                        }
                    } catch(e) {
                        console.error("Error obteniendo nueva imagen:", e);
                    }
                }
                
                await session.update({
                    image: imageToUse,
                    referenceImage: imageToUse,
                    prompt: { text: 'virtual try on this ' + engColor + ' clothing', image: imageToUse }
                });
            } catch(e) {
                console.error("Failed to change color", e);
            }
            loader.style.display = 'none';
        };

        window.onload = startAR;
    </script>
</body>
</html>
